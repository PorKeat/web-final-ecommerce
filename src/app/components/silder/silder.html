<div class="relative w-full h-[600px] overflow-hidden rounded-2xl bg-gray-100 group"
     (mouseenter)="handleInteraction()"
     (mouseleave)="isAutoPlaying = true; startAutoplay()">
  <ng-container *ngFor="let slide of slides; let i = index">
    <div class="absolute inset-0 transition-all duration-700 ease-in-out"
         [ngClass]="{'opacity-100 scale-100': i === currentSlide, 'opacity-0 scale-105': i !== currentSlide}">
      <img [src]="slide?.image || '/assets/placeholder.svg'" [alt]="slide?.title || 'Slide image'" class="w-full h-full object-cover">
      <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-black/20 to-transparent"></div>
      <div class="absolute bottom-0 left-0 right-0 p-12">
        <div [ngClass]="{'opacity-100 translate-y-0': i === currentSlide, 'opacity-0 translate-y-8': i !== currentSlide}"
             class="transition-all duration-700 delay-200">
          <h2 class="text-5xl font-bold text-white mb-3">{{ slide?.title }}</h2>
          <p class="text-xl text-white/90">{{ slide?.description }}</p>
        </div>
      </div>
    </div>
  </ng-container>
</div>
