<div
  class="group relative flex flex-col overflow-hidden rounded-3xl border border-gray-600 bg-black text-white shadow-lg transition-all duration-300 hover:-translate-y-3 hover:shadow-2xl cursor-pointer"
>
  <!-- Product Image -->
  <div class="relative h-80 w-full overflow-hidden rounded-t-3xl bg-black">
    <img
      [src]="product.imageUrl || 'https://via.placeholder.com/400x400?text=No+Image'"
      [alt]="product.name"
      class="h-full w-full object-contain transition-transform duration-700 group-hover:scale-110"
    />
    <!-- Stock Badge -->
    <span
      *ngIf="product.qty === 0"
      class="absolute top-4 left-4 bg-white text-black text-xs font-semibold px-3 py-1.5 rounded-full shadow-lg"
    >
      Out of Stock
    </span>
    <span
      *ngIf="product.qty > 0 && product.qty < 5"
      class="absolute top-4 left-4 bg-gray-400 text-black text-xs font-semibold px-3 py-1.5 rounded-full shadow-lg"
    >
      Low Stock
    </span>
  </div>

  <!-- Product Info -->
  <div class="flex flex-col flex-1 p-6 space-y-3">
    <h3 class="text-xl font-bold truncate text-white group-hover:text-gray-300 transition-colors">
      {{ product.name }}
    </h3>
    <p class="text-sm text-gray-400">Available Qty: {{ product.qty }}</p>

    <div class="mt-2 flex items-center justify-between">
      <span class="text-2xl font-extrabold text-white">${{ product.price }}</span>
      <span class="text-sm text-gray-400">Amount: ${{ product.amount }}</span>
    </div>

    <!-- Action Buttons -->
    <div class="mt-5 flex gap-3">
      <button
        class="flex-1 rounded-2xl bg-gray-800 text-white px-5 py-3 font-semibold uppercase tracking-wide transition-all duration-300 hover:bg-gray-700 hover:scale-105 shadow-md"
      >
        Add to Cart
      </button>
      <button
        class="flex-1 rounded-2xl border border-gray-500 px-5 py-3 text-white font-semibold uppercase tracking-wide transition-all duration-300 hover:bg-gray-700 hover:scale-105 shadow-md"
      >
        View Details
      </button>
    </div>
  </div>
</div>
