<div
  class="group relative flex flex-col overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-2xl"
>
  <!-- Product Image -->
  <div class="relative h-56 w-full overflow-hidden bg-gray-100">
    <img
      [src]="product?.imageUrl || 'https://via.placeholder.com/300x300?text=No+Image'"
      [alt]="product?.name"
      class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-110"
    />
    <!-- Stock Badge -->
    <span
      *ngIf="product?.qty === 0"
      class="absolute top-3 left-3 bg-red-600 text-white text-xs font-semibold px-2 py-1 rounded"
    >
      Out of Stock
    </span>
    <span
      *ngIf="product?.qty > 0 && product?.qty < 5"
      class="absolute top-3 left-3 bg-yellow-500 text-white text-xs font-semibold px-2 py-1 rounded"
    >
      Low Stock
    </span>
  </div>

  <!-- Product Info -->
  <div class="flex flex-col flex-1 p-5">
    <h3 class="text-lg font-semibold text-gray-900 truncate">{{ product?.name }}</h3>
    <p class="mt-2 text-sm text-gray-500">Available Qty: {{ product?.qty }}</p>

    <div class="mt-4 flex items-center justify-between">
      <span class="text-xl font-bold text-indigo-600">${{ product?.price }}</span>
      <span class="text-sm text-gray-400">Amount: ${{ product?.amount }}</span>
    </div>

    <!-- Buttons -->
    <div class="mt-5 flex gap-3">
      <button
        class="flex-1 rounded-xl bg-indigo-600 px-4 py-2 text-white font-medium transition hover:bg-indigo-700"
      >
        Add to Cart
      </button>
      <button
        class="flex-1 rounded-xl border border-gray-300 px-4 py-2 text-gray-700 font-medium transition hover:bg-gray-100"
      >
        View Details
      </button>
    </div>
  </div>
</div>
