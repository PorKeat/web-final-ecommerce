<div class="p-4 max-w-3xl mx-auto">
  <h2 class="text-2xl font-bold mb-4">Shopping Cart</h2>

  <div *ngIf="cart.length; else emptyCart">
    <div *ngFor="let item of cart" class="flex items-center justify-between border-b py-2">
      <div class="flex items-center">
        <img [src]="item.imageUrl" class="w-20 h-20 object-cover rounded" />
        <div class="ml-4">
          <h3 class="font-semibold">{{ item.name }}</h3>
          <p>${{ item.price }}</p>
        </div>
      </div>
      <div>
        <input
          type="number"
          [(ngModel)]="item.quantity"
          (change)="updateQty(item, item.quantity!)"
          class="border rounded w-16 text-center"
        />
        <button (click)="removeItem(item.id)" class="ml-2 text-red-500 hover:underline">
          Remove
        </button>
      </div>
    </div>

    <div class="mt-4 text-right">
      <h3 class="text-xl font-bold">Total: ${{ total }}</h3>
      <button
        (click)="checkout()"
        class="mt-2 bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600"
      >
        Checkout
      </button>
    </div>
  </div>

  <ng-template #emptyCart>
    <p>Your cart is empty!</p>
  </ng-template>
</div>
