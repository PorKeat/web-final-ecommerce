<main class="p-4 bg-white">
  <app-product-carousel></app-product-carousel>

  <h2 class="text-2xl font-bold mb-10 text-center">Product Catalog</h2>

  <!-- No products message -->
  <div *ngIf="products.length === 0" class="text-gray-500 p-4 text-center">
    No products available
  </div>

  <!-- Product List -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    <article
      *ngFor="let product of products; trackBy: trackById"
      class="group relative flex flex-col overflow-hidden rounded-2xl border border-gray-200 bg-white text-black shadow-md transition-all duration-300 hover:-translate-y-2 hover:shadow-2xl cursor-pointer"
      (click)="viewDetail(product.id)"
    >
      <!-- Product Image -->
      <div class="relative h-80 w-full overflow-hidden rounded-t-2xl bg-white">
        <img
          [src]="product.imageUrl || 'https://via.placeholder.com/400x400?text=No+Image'"
          [alt]="product.name"
          class="h-full w-full object-contain transition-transform duration-500 group-hover:scale-105"
        />

        <!-- Stock Badge -->
        <span
          *ngIf="product.qty === 0"
          class="absolute top-3 left-3 bg-red-600 text-white text-xs font-semibold px-3 py-1.5 rounded-full shadow"
        >
          Out of Stock
        </span>
        <span
          *ngIf="product.qty > 0 && product.qty < 5"
          class="absolute top-3 left-3 bg-yellow-400 text-black text-xs font-semibold px-3 py-1.5 rounded-full shadow"
        >
          Low Stock
        </span>
      </div>

      <!-- Product Info -->
      <div class="flex flex-col flex-1 p-6 space-y-2">
        <h3 class="text-lg font-bold truncate">{{ product.name }}</h3>
        <p class="text-sm text-gray-500">Available Qty: {{ product.qty }}</p>

        <div class="mt-2 flex items-center justify-between">
          <span class="text-xl font-extrabold">${{ product.price }}</span>
          <span class="text-sm text-gray-500">Amount: ${{ product.amount }}</span>
        </div>

        <!-- Action Buttons -->
        <div class="mt-5 flex gap-3">
          <button
            (click)="addToCart(product); $event.stopPropagation()"
            class="flex-1 rounded-2xl bg-black text-white px-5 py-3 font-semibold uppercase tracking-wide transition-all hover:bg-gray-800 hover:scale-105 shadow-md"
          >
            Add to Cart
          </button>
          <button
            (click)="viewDetail(product.id); $event.stopPropagation()"
            class="flex-1 rounded-2xl border border-gray-400 px-5 py-3 text-black font-semibold uppercase tracking-wide transition-all hover:bg-gray-100 hover:scale-105 shadow-md"
          >
            View Details
          </button>
        </div>
      </div>
    </article>
  </div>
</main>
