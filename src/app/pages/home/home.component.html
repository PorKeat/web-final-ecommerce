<!-- Main Content -->
<main class="p-4">
  <app-product-carousel></app-product-carousel>

  <h2 class="text-2xl font-bold mb-4">Product Catalog</h2>

  <!-- No products message -->
  <!-- <div *ngIf="products.length === 0" class="text-gray-500 p-4">No products available</div> -->

  <!-- Product List -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
  <article
    *ngFor="let product of products"
    class="group relative bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 cursor-pointer border border-gray-100 hover:border-indigo-200"
    (click)="viewDetail(product.id)"
    [attr.aria-label]="'View details for ' + product?.name"
  >
    <!-- Image Container with Overlay -->
    <div class="relative h-72 w-full bg-gradient-to-br from-gray-50 to-gray-100 overflow-hidden">
      <img
        [src]="product?.imageUrl || '/assets/placeholder.svg'"
        [alt]="product?.name || 'Product image'"
        class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 ease-out"
        loading="lazy"
      />
      
      <!-- Gradient Overlay for Better Text Readability -->
      <div class="absolute inset-0 bg-gradient-to-t from-black/20 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
      
      <!-- Stock Badge - Improved Visibility & States -->
      <div class="absolute top-4 right-4 z-10">
        <span 
          [ngClass]="{
            'bg-emerald-500/90 text-white': product?.qty,
            
            'bg-red-500/90 text-white': product?.qty === 0
          }"
          class="px-3 py-1.5 backdrop-blur-sm rounded-full text-xs font-semibold shadow-lg flex items-center gap-1.5"
        >
          <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
          <span *ngIf="product?.qty">{{ product?.qty }} in stock</span>
          <span *ngIf="!product?.qty">Out of stock</span>
        </span>
      </div>


      <!-- Quick View Badge - Desktop Only -->
      <div class="hidden sm:flex absolute bottom-4 left-1/2 -translate-x-1/2 opacity-0 group-hover:opacity-100 transition-all duration-300 transform translate-y-2 group-hover:translate-y-0">
        <span class="px-4 py-2 bg-white/95 backdrop-blur-sm rounded-full text-xs font-semibold text-gray-700 shadow-lg flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
          </svg>
          Quick View
        </span>
      </div>
    </div>

    <!-- Product Info -->
    <div class="p-5">
      <!-- Category/Brand (Optional) -->

      
      <h3 class="text-lg font-bold text-gray-900 mb-2 line-clamp-2 min-h-[3.5rem] group-hover:text-indigo-600 transition-colors leading-tight">
        {{ product?.name }}
      </h3>
      
      <!-- Rating & Reviews -->


      <!-- Price Section -->
      <div class="flex items-end justify-between mb-5">
        <div>
          <p class="text-2xl font-bold text-gray-900">
            ${{ product?.price | number:'1.2-2' }}
          </p>
          <!-- Optional: Show original price if on sale -->
          <!-- <p class="text-sm text-gray-400 line-through">$99.99</p> -->
        </div>
        
        <!-- Delivery Badge -->
        <div class="flex items-center gap-1 text-xs text-emerald-600 font-medium">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/>
          </svg>
          <span class="hidden lg:inline">Free ship</span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex gap-2">
        <button
          (click)="addToCart(product); $event.stopPropagation()"
          [disabled]="product?.qty === 0"
          class="flex-1 rounded-xl bg-black text-white py-3 px-4 font-semibold transition-all duration-300 hover:bg-gray-800 hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 disabled:from-gray-300 disabled:to-gray-400 disabled:cursor-not-allowed disabled:hover:translate-y-0 disabled:hover:shadow-none"
          
          [attr.aria-label]="product?.qty === 0 ? 'Out of stock' : 'Add ' + product?.name + ' to cart'"
        >
          <span class="flex items-center justify-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
            </svg>
            <span *ngIf="product?.qty">Add to Cart</span>
            <span *ngIf="product?.qty === 0">Out of Stock</span>
          </span>
        </button>
        
        <!-- Quick Actions Button -->

      </div>

      <!-- View Details Link -->
      <a
        [routerLink]="['/product', product?.id]"
        class="mt-3 text-center text-gray-500 text-sm font-medium py-2 hover:text-indigo-600 transition-colors flex items-center justify-center gap-1 group/link"
        (click)="$event.stopPropagation()"
      >
        <span>View Full Details</span>
        <svg class="w-4 h-4 transition-transform group-hover/link:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </a>
    </div>
  </article>
</div>
</main>

<!-- Footer -->
