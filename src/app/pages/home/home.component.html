
<!-- Main Content -->
<main class="p-4">
  <h2 class="text-2xl font-bold mb-4">Product Catalog</h2>

  <!-- No products message -->
  <div *ngIf="products.length === 0" class="text-gray-500 p-4">No products available</div>

  <!-- Product List -->
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
    <div
      *ngFor="let product of products"
      class="border rounded-lg p-4 shadow hover:scale-105 transition cursor-pointer"
      (click)="viewDetail(product.id)"
    >
      <img
        [src]="product.imageUrl"
        alt="{{ product.name }}"
        class="w-full h-48 object-cover rounded"
      />
      <h2 class="mt-2 font-semibold text-lg">{{ product.name }}</h2>
      <p class="text-gray-700 mt-1">${{ product.price }}</p>
      <p class="text-gray-500 mt-1">Qty: {{ product.qty }}</p>
    </div>
  </div>
</main>

<!-- Footer -->
<footer class="bg-gray-100 text-gray-600 text-center p-4 mt-8">&copy; 2025 My Store</footer>
