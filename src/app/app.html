<!-- Navbar -->
<nav class="fixed top-0 z-50 w-full border-b border-gray-200 bg-white backdrop-blur-xl shadow-sm">
  <div class="container mx-auto px-6 lg:px-8">
    <div class="flex h-20 items-center justify-between">
      <!-- Left Section: Logo & Menu -->
      <div class="flex items-center gap-12">
        <!-- Mobile Menu Button -->
        <button class="md:hidden p-2 rounded-md hover:bg-gray-100 transition">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>

        <!-- Logo -->
        <a routerLink="/" class="flex items-center gap-2">
          <span class="text-2xl font-extrabold tracking-tight text-black">SV3</span>
        </a>

        <!-- Desktop Menu -->
        <nav class="hidden md:flex gap-8">
          <a
            routerLink="/"
            class="text-sm font-medium text-gray-600 hover:text-black transition-colors"
            >Home</a
          >
          <a
            routerLink="/about"
            class="text-sm font-medium text-gray-600 hover:text-black transition-colors"
            >About</a
          >
        </nav>
      </div>

      <!-- Right Section: Search & Cart -->
      <div class="flex items-center gap-4">
        <!-- Search Button -->
        <button class="hidden md:flex p-2 rounded-full hover:bg-gray-100 transition">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5 text-gray-600"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="7" />
            <path d="M21 21l-4.35-4.35" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <!-- Cart -->
        <a routerLink="/cart" class="relative p-2 rounded-full hover:bg-gray-100 transition">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6 text-gray-600"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M6 6h15l-1.5 9h-13z" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="9" cy="20" r="1" />
            <circle cx="19" cy="20" r="1" />
          </svg>

          <span
            *ngIf="cartCount > 0"
            class="absolute -top-1 -right-1 h-4 w-4 rounded-full bg-red-500 text-white text-[10px] flex items-center justify-center font-medium shadow-md"
          >
            {{ cartCount }}
          </span>
        </a>
      </div>
    </div>
  </div>
</nav>

<router-outlet></router-outlet>

<!-- Footer -->
<footer class="bg-white pt-20 pb-5 text-center text-gray-600">
  &copy; {{ currentYear }} SV3 Electronics. All rights reserved.
</footer>
